services:
  server:
    image: topology-server
    build:
      context: ./TopologyServer
    ports:
      - "5023:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Auth0__Domain: ${AUTH0_DOMAIN:-}
      Auth0__Audience: ${AUTH0_AUDIENCE:-}
      ConnectionStrings__MongoDB: ${MONGODB_CONNECTION_STRING:-}

  frontend:
    image: topology-client
    build:
      context: ./TopologyClient
      args:
        NODE_VERSION: 24.5.0
    ports:
      - "3000:3000"
    depends_on:
      - server

  frontend-dev:
    image: topology-client-dev
    profiles:
      - dev
    build:
      context: ./TopologyClient
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: 24.5.0
    ports:
      - "3000:3000"
    volumes:
      - ./TopologyClient:/app
      - /app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
    depends_on:
      - server
