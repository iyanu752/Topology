services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    image: topology-server
    build:
      context: ./TopologyServer
    ports:
      - "5023:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Auth0__Domain: ${AUTH0_DOMAIN:-local-dev.auth0.com}
      Auth0__Audience: ${AUTH0_AUDIENCE:-topology-local-api}
      ConnectionStrings__MongoDB: ${MONGODB_DOCKER_CONNECTION_STRING:-mongodb://mongo:27017}
    depends_on:
      - mongo

  frontend:
    image: topology-client
    build:
      context: ./TopologyClient
      args:
        NODE_VERSION: 24.5.0
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5023}
    depends_on:
      - server

  frontend-dev:
    image: topology-client-dev
    profiles:
      - dev
    build:
      context: ./TopologyClient
      dockerfile: Dockerfile.dev
      args:
        NODE_VERSION: 24.5.0
    ports:
      - "3000:3000"
    volumes:
      - ./TopologyClient:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5023}
      WATCHPACK_POLLING: "true"
    depends_on:
      - server

volumes:
  mongo-data:
